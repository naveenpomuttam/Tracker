<!DOCTYPE html>
<html lang="ml">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Live GPS Tracker</title>

  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >


  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      font-family: Arial, sans-serif;

    }


    #map {

      width: 100%;
      height: 100vh;

    }


    #status {

      position: absolute;

      top: 10px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 1000;

      background: rgba(
        0,
        0,
        0,
        0.85
      );

      color: white;

      padding: 10px 18px;

      border-radius: 22px;

      font-size: 14px;

      text-align: center;

      box-shadow:
        0 3px 10px
        rgba(0,0,0,0.3);

      max-width: 90%;

    }


    /* WELCOME MODAL */

    #welcomeModal {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background:
        rgba(0,0,0,0.7);

      z-index: 9999;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;

      box-sizing: border-box;

    }


    .modal-content {

      background: white;

      padding: 25px;

      border-radius: 16px;

      max-width: 400px;

      width: 100%;

      text-align: center;

      box-shadow:
        0 10px 25px
        rgba(0,0,0,0.3);

    }


    .bus-icon {

      font-size: 50px;

      margin-bottom: 10px;

    }


    .modal-title {

      font-size: 20px;

      font-weight: bold;

      color: #1a73e8;

      margin-bottom: 10px;

    }


    .modal-text {

      font-size: 14px;

      color: #444;

      line-height: 1.6;

      margin-bottom: 20px;

    }


    .start-btn {

      background: #28a745;

      color: white;

      border: none;

      padding: 12px 24px;

      font-size: 16px;

      font-weight: bold;

      border-radius: 25px;

      cursor: pointer;

    }


  </style>

</head>


<body>


  <!-- WELCOME -->

  <div id="welcomeModal">

    <div class="modal-content">

      <div class="bus-icon">
        🚌
      </div>


      <div class="modal-title">

        സ്വാഗതം!

      </div>


      <div class="modal-text">

        ഇത്
        <b>നവീൻ ചന്ദ്ര</b>
        വികസിപ്പിച്ചെടുത്ത
        ജിപിഎസ് ട്രാക്കർ ആപ്പാണ്.

        <br><br>

        ലൈവ് ട്രാക്കിംഗ് ആരംഭിക്കാൻ
        താഴെയുള്ള ബട്ടൺ ക്ലിക്ക് ചെയ്യുക.

      </div>


      <button
        class="start-btn"
        onclick="startTracking()"
      >

        ട്രാക്കിംഗ് ആരംഭിക്കുക

      </button>

    </div>

  </div>



  <!-- STATUS -->

  <div id="status">

    Connecting to Firebase...

  </div>



  <!-- MAP -->

  <div id="map"></div>



  <!-- LEAFLET -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>



  <!-- FIREBASE -->

  <script
    src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js">
  </script>


  <script
    src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js">
  </script>



  <script>


    /* =====================================
       START APP
    ===================================== */

    function startTracking() {

      document
        .getElementById(
          "welcomeModal"
        )
        .style
        .display = "none";

    }



    /* =====================================
       FIREBASE CONFIG
    ===================================== */

    const firebaseConfig = {

      databaseURL:
      "https://gps-tracker-4714a-default-rtdb.firebaseio.com"

    };


    firebase.initializeApp(
      firebaseConfig
    );


    const database =
      firebase.database();



    /* =====================================
       MAP
    ===================================== */

    const map =
      L.map("map")
      .setView(
        [8.7156794, 76.7772765],
        16
      );


    L.tileLayer(

      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

      {

        maxZoom: 19,

        attribution:
          "© OpenStreetMap"

      }

    ).addTo(map);



    /* =====================================
       GEOFENCE
    ===================================== */

    const GEOFENCE_LAT =
      8.7156794;


    const GEOFENCE_LNG =
      76.7772765;


    const GEOFENCE_RADIUS =
      500;



    const geofenceCenter =
      L.latLng(

        GEOFENCE_LAT,
        GEOFENCE_LNG

      );



    L.circle(

      geofenceCenter,

      {

        radius:
          GEOFENCE_RADIUS

      }

    )
    .addTo(map)
    .bindPopup(
      "<b>500 മീറ്റർ Geofence</b>"
    );



    L.marker(

      geofenceCenter

    )
    .addTo(map)
    .bindPopup(
      "<b>Geofence Center 📍</b>"
    );



    /* =====================================
       VARIABLES
    ===================================== */

    let gpsMarker = null;

    let firstLoad = true;

    let wasInside = null;


    const statusDiv =
      document.getElementById(
        "status"
      );



    /* =====================================
       TRACKER OFFLINE TIME

       ESP32 2 സെക്കൻഡിൽ update ചെയ്യും.

       6 സെക്കൻഡിൽ പുതിയ update ഇല്ലെങ്കിൽ
       OFFLINE ആയി കണക്കാക്കും.
    ===================================== */

    const OFFLINE_TIMEOUT =
      6000;



    let lastUpdateTime = 0;



    /* =====================================
       REMOVE GPS MARKER
    ===================================== */

    function removeGPSMarker() {

      if (gpsMarker) {

        map.removeLayer(
          gpsMarker
        );

        gpsMarker = null;

      }

    }



    /* =====================================
       SET OFFLINE
    ===================================== */

    function setTrackerOffline() {

      removeGPSMarker();


      statusDiv.innerText =
        "🔴 GPS Tracker Offline";


      statusDiv.style.background =
        "rgba(220,53,69,0.95)";


      // Geofence state reset

      wasInside = null;

    }



    /* =====================================
       DISTANCE CALCULATION
    ===================================== */

    function getDistance(
      lat,
      lng
    ) {

      const trackerPosition =
        L.latLng(
          lat,
          lng
        );


      return
        geofenceCenter.distanceTo(
          trackerPosition
        );

    }



    /* =====================================
       CHECK OFFLINE EVERY 2 SECONDS
    ===================================== */

    setInterval(

      function() {

        if (
          lastUpdateTime === 0
        ) {

          return;

        }


        const now =
          Date.now();


        const difference =
          now - lastUpdateTime;


        if (
          difference >
          OFFLINE_TIMEOUT
        ) {

          setTrackerOffline();

        }

      },

      2000

    );



    /* =====================================
       FIREBASE DATA
    ===================================== */

    database
      .ref("GPS")
      .on(

        "value",

        function(snapshot) {


          const data =
            snapshot.val();


          if (!data) {

            setTrackerOffline();

            return;

          }



          /* ===============================
             GET STATUS
          =============================== */

          const gpsStatus =
            data.status ||
            "OFFLINE";



          /* ===============================
             GET LAST UPDATE
          =============================== */

          const firebaseLastUpdate =
            data.lastUpdate;



          /* ===============================
             CHECK OLD DATA
          =============================== */

          if (
            firebaseLastUpdate
          ) {

            const currentTime =
              Date.now();


            const dataAge =
              currentTime -
              firebaseLastUpdate;


            if (
              dataAge >
              OFFLINE_TIMEOUT
            ) {

              setTrackerOffline();

              return;

            }

          }



          /* ===============================
             NO GPS FIX
          =============================== */

          if (
            gpsStatus !== "ONLINE"
          ) {


            removeGPSMarker();


            statusDiv.innerText =
              "🟡 Waiting for GPS Fix...";


            statusDiv.style.background =
              "rgba(255,193,7,0.95)";


            return;

          }



          /* ===============================
             LATITUDE
          =============================== */

          const rawLat =
            data.latitude ||
            data.Latitude ||
            data.lat;



          /* ===============================
             LONGITUDE
          =============================== */

          const rawLng =
            data.longitude ||
            data.Longitude ||
            data.lng;



          const lat =
            parseFloat(
              rawLat
            );


          const lng =
            parseFloat(
              rawLng
            );




          /* ===============================
             INVALID GPS
          =============================== */

          if (

            isNaN(lat) ||

            isNaN(lng) ||

            lat === 0 ||

            lng === 0

          ) {

            removeGPSMarker();


            statusDiv.innerText =
              "🟡 Waiting for valid GPS...";


            return;

          }



          /* ===============================
             DATA IS LIVE
          =============================== */

          lastUpdateTime =
            Date.now();



          /* ===============================
             DISTANCE
          =============================== */

          const distance =
            getDistance(
              lat,
              lng
            );



          const inside =
            distance <=
            GEOFENCE_RADIUS;



          /* ===============================
             STATUS
          =============================== */

          if (inside) {


            statusDiv.innerText =

              "🟢 GPS Live | Geofence ഉള്ളിൽ | " +

              Math.round(
                distance
              ) +

              " m";


            statusDiv.style.background =
              "rgba(40,167,69,0.95)";


          }

          else {


            statusDiv.innerText =

              "🔴 GPS Live | Geofence പുറത്ത് | " +

              Math.round(
                distance
              ) +

              " m";


            statusDiv.style.background =
              "rgba(220,53,69,0.95)";

          }



          /* ===============================
             GPS MARKER
          =============================== */

          if (gpsMarker) {


            gpsMarker.setLatLng(
              [lat, lng]
            );


          }

          else {


            gpsMarker =
              L.marker(
                [lat, lng]
              )
              .addTo(map)
              .bindPopup(
                "<b>ESP32 GPS Tracker 🚌</b>"
              );

          }



          /* ===============================
             FIRST LOAD
          =============================== */

          if (firstLoad) {


            map.setView(
              [lat, lng],
              17
            );


            firstLoad = false;


          }

          else {


            map.panTo(
              [lat, lng]
            );

          }



          /* ===============================
             SAVE GEOFENCE STATE
          =============================== */

          wasInside =
            inside;


        },


        function(error) {


          console.error(
            error
          );


          setTrackerOffline();


        }

      );


  </script>


</body>

</html>
