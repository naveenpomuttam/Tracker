<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live GPS Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: Arial, sans-serif;
    }
    #map {
      height: 100vh;
      width: 100%;
    }
    #status {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      text-align: center;
      transition: background 0.3s ease;
    }
  </style>
</head>
<body>

  <div id="status">Connecting to Firebase...</div>
  <div id="map"></div>

  <!-- Leaflet JS for Maps -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // Firebase Config
    const firebaseConfig = {
      databaseURL: "https://gps-tracker-4714a-default-rtdb.firebaseio.com"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Leaflet Map Initialization
    const map = L.map('map').setView([0, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let marker;
    let firstLoad = true;
    let lastDataTime = Date.now();

    const statusDiv = document.getElementById('status');

    // Read Data from 'GPS' path
    const gpsRef = database.ref('GPS');

    gpsRef.on('value', (snapshot) => {
      const data = snapshot.val();

      if (data) {
        lastDataTime = Date.now(); // പുതിയ ഡാറ്റ എത്തിയ സമയം രേഖപ്പെടുത്തുന്നു

        const rawLat = data.Latitude || data.latitude || data.lat;
        const rawLng = data.longitude || data.Longitude || data.lng;
        const deviceStatus = data.status || data.Status || "ONLINE";

        const lat = parseFloat(rawLat);
        const lng = parseFloat(rawLng);

        if (deviceStatus === "ONLINE" && !isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0) {
          const sats = data.satellites || data.Satellites || 0;
          
          statusDiv.innerText = `Live GPS Connected 🟢 (${sats} Satellites)`;
          statusDiv.style.background = "rgba(40, 167, 69, 0.9)"; // Green Color
          statusDiv.style.color = "#fff";

          // Marker Update
          if (marker) {
            marker.setLatLng([lat, lng]);
          } else {
            marker = L.marker([lat, lng]).addTo(map);
          }

          if (firstLoad) {
            map.setView([lat, lng], 16);
            firstLoad = false;
          }
        } else if (deviceStatus === "NO_GPS_FIX") {
          statusDiv.innerText = "Waiting for GPS Satellite Fix... 🟡 (0 Satellites)";
          statusDiv.style.background = "rgba(255, 193, 7, 0.9)"; // Yellow Color
          statusDiv.style.color = "#000";
        }
      }
    });

    // ടൈമർ: കഴിഞ്ഞ 8 സെക്കൻഡായി ലൈവ് ഡാറ്റ വന്നില്ലെങ്കിൽ ഓഫ്‌ലൈനായി കാണിക്കും
    setInterval(() => {
      if (Date.now() - lastDataTime > 8000) {
        statusDiv.innerText = "Bus Offline 🔴 (0 Satellites)";
        statusDiv.style.background = "rgba(220, 53, 69, 0.9)"; // Red Color
        statusDiv.style.color = "#fff";
      }
    }, 2000);
  </script>
</body>
</html>
