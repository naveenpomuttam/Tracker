<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Live GPS Tracker</title>

  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    #status {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;

      background: rgba(0, 0, 0, 0.85);
      color: white;

      padding: 10px 16px;
      border-radius: 20px;

      font-size: 14px;
      text-align: center;

      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      max-width: 90%;
    }

    /* Welcome Popup */
    #welcomeModal {
      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background: rgba(0,0,0,0.7);

      z-index: 9999;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
      box-sizing: border-box;
    }

    .modal-content {
      background: white;

      padding: 25px;

      border-radius: 16px;

      max-width: 400px;
      width: 100%;

      text-align: center;

      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .bus-icon {
      font-size: 50px;
      margin-bottom: 10px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: bold;

      color: #1a73e8;

      margin-bottom: 10px;
    }

    .modal-text {
      font-size: 14px;

      color: #444;

      line-height: 1.6;

      margin-bottom: 20px;
    }

    .start-btn {
      background: #28a745;

      color: white;

      border: none;

      padding: 12px 24px;

      font-size: 16px;

      font-weight: bold;

      border-radius: 25px;

      cursor: pointer;

      margin: 5px;
    }

    .test-btn {
      background: #1a73e8;

      color: white;

      border: none;

      padding: 10px 18px;

      font-size: 14px;

      font-weight: bold;

      border-radius: 20px;

      cursor: pointer;

      margin-top: 8px;
    }

    #controls {
      position: absolute;

      bottom: 20px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 1000;

      text-align: center;
    }

    .control-btn {
      background: white;

      border: none;

      padding: 12px 18px;

      border-radius: 25px;

      font-size: 14px;

      font-weight: bold;

      box-shadow: 0 3px 10px rgba(0,0,0,0.25);

      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- Welcome Window -->
  <div id="welcomeModal">

    <div class="modal-content">

      <div class="bus-icon">🚌</div>

      <div class="modal-title">
        സ്വാഗതം!
      </div>

      <div class="modal-text">
        ഇത് <b>നവീൻ ചന്ദ്ര</b> വികസിപ്പിച്ചെടുത്ത
        ജിപിഎസ് ട്രാക്കർ ആപ്പാണ്.
        <br><br>
        ലൈവ് ട്രാക്കിംഗ് ആരംഭിക്കാൻ
        താഴെയുള്ള ബട്ടൺ ക്ലിക്ക് ചെയ്യുക.
      </div>

      <button class="start-btn" onclick="startTracking()">
        ട്രാക്കിംഗ് ആരംഭിക്കുക
      </button>

    </div>

  </div>


  <!-- Status -->
  <div id="status">
    Connecting to Firebase...
  </div>


  <!-- Map -->
  <div id="map"></div>


  <!-- Test Button -->
  <div id="controls">

    <button class="control-btn"
            onclick="testNotification()">
      🔔 Test Notification
    </button>

  </div>


  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>


  <script>

    /* =========================================
       START TRACKING
    ========================================= */

    function startTracking() {

      document.getElementById("welcomeModal").style.display = "none";

      requestNotificationPermission();

    }


    /* =========================================
       NOTIFICATION PERMISSION
    ========================================= */

    function requestNotificationPermission() {

      if ("Notification" in window) {

        if (Notification.permission === "default") {

          Notification.requestPermission()
            .then(function(permission) {

              console.log(
                "Notification permission:",
                permission
              );

            });

        }

      }

    }


    /* =========================================
       TEST NOTIFICATION
    ========================================= */

    function testNotification() {

      if (!("Notification" in window)) {

        alert(
          "ഈ APK / browser Notification support ചെയ്യുന്നില്ല."
        );

        return;

      }


      if (Notification.permission === "granted") {

        new Notification(
          "🚌 GPS Tracker Test",
          {
            body:
              "Notification ശരിയായി പ്രവർത്തിക്കുന്നു! ✅"
          }
        );

        return;

      }


      if (Notification.permission === "default") {

        Notification.requestPermission()
          .then(function(permission) {

            if (permission === "granted") {

              new Notification(
                "🚌 GPS Tracker Test",
                {
                  body:
                    "Notification ശരിയായി പ്രവർത്തിക്കുന്നു! ✅"
                }
              );

            } else {

              alert(
                "Notification permission അനുവദിച്ചിട്ടില്ല."
              );

            }

          });

        return;

      }


      alert(
        "Notification permission OFF ആണ്. Android Settings-ൽ ON ചെയ്യുക."
      );

    }


    /* =========================================
       FIREBASE CONFIG
    ========================================= */

    const firebaseConfig = {

      databaseURL:
        "https://gps-tracker-4714a-default-rtdb.firebaseio.com"

    };


    firebase.initializeApp(firebaseConfig);


    const database =
      firebase.database();


    /* =========================================
       MAP
    ========================================= */

    const map =
      L.map("map").setView(
        [8.7335, 76.7722],
        16
      );


    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,

        attribution:
          "© OpenStreetMap"
      }
    ).addTo(map);


    /* =========================================
       GEOFENCE SETTINGS
    ========================================= */

    const GEOFENCE_LAT =
      8.7156794;

    const GEOFENCE_LNG =
      76.7772765;

    const GEOFENCE_RADIUS =
      500;


    /* =========================================
       GEOFENCE CIRCLE
    ========================================= */

    const geofenceCenter =
      L.latLng(
        GEOFENCE_LAT,
        GEOFENCE_LNG
      );


    const geofenceCircle =
      L.circle(
        geofenceCenter,
        {
          radius: GEOFENCE_RADIUS
        }
      ).addTo(map);


    geofenceCircle.bindPopup(
      "<b>500 മീറ്റർ Geofence</b><br>" +
      "GPS Tracker Area"
    );


    /* =========================================
       GEOFENCE CENTER MARKER
    ========================================= */

    L.marker(
      geofenceCenter
    )
    .addTo(map)
    .bindPopup(
      "<b>Geofence Center</b><br>" +
      "500 meter radius"
    );


    /* =========================================
       GPS VARIABLES
    ========================================= */

    let gpsMarker = null;

    let firstLoad = true;

    let wasInside = null;


    const statusDiv =
      document.getElementById("status");


    /* =========================================
       DISTANCE FUNCTION
    ========================================= */

    function getDistanceFromGeofence(
      lat,
      lng
    ) {

      const currentPosition =
        L.latLng(lat, lng);

      return geofenceCenter.distanceTo(
        currentPosition
      );

    }


    /* =========================================
       GEOFENCE NOTIFICATION
    ========================================= */

    function sendGeofenceNotification(
      distance
    ) {

      if (
        "Notification" in window &&
        Notification.permission === "granted"
      ) {

        new Notification(
          "🚌 GPS Tracker",
          {
            body:
              "Tracker 500 മീറ്റർ Geofence-നുള്ളിൽ പ്രവേശിച്ചു.\n" +
              "Distance: " +
              Math.round(distance) +
              " meters"
          }
        );

      }

    }


    /* =========================================
       FIREBASE GPS DATA
    ========================================= */

    database
      .ref("GPS")
      .on(
        "value",
        function(snapshot) {

          const data =
            snapshot.val();


          if (!data) {

            statusDiv.innerText =
              "Waiting for GPS data...";

            return;

          }


          /* Get latitude */

          const rawLat =
            data.Latitude ||
            data.latitude ||
            data.lat;


          /* Get longitude */

          const rawLng =
            data.Longitude ||
            data.longitude ||
            data.lng;


          const lat =
            parseFloat(rawLat);


          const lng =
            parseFloat(rawLng);


          /* Check GPS */

          if (
            isNaN(lat) ||
            isNaN(lng) ||
            lat === 0 ||
            lng === 0
          ) {

            statusDiv.innerText =
              "Waiting for valid GPS...";

            return;

          }


          /* =================================
             DISTANCE
          ================================= */

          const distance =
            getDistanceFromGeofence(
              lat,
              lng
            );


          const inside =
            distance <= GEOFENCE_RADIUS;


          /* =================================
             STATUS
          ================================= */

          if (inside) {

            statusDiv.innerText =
              "🟢 GPS Live | " +
              "Geofence ഉള്ളിൽ | " +
              Math.round(distance) +
              " m";

            statusDiv.style.background =
              "rgba(40,167,69,0.9)";

          } else {

            statusDiv.innerText =
              "🔴 GPS Live | " +
              "Geofence പുറത്ത് | " +
              Math.round(distance) +
              " m";

            statusDiv.style.background =
              "rgba(220,53,69,0.9)";

          }


          /* =================================
             GPS MARKER
          ================================= */

          if (gpsMarker) {

            gpsMarker.setLatLng(
              [lat, lng]
            );

          } else {

            gpsMarker =
              L.marker(
                [lat, lng]
              )
              .addTo(map)
              .bindPopup(
                "<b>ESP32 GPS Tracker 🚌</b>"
              );

          }


          /* =================================
             FIRST MAP LOAD
          ================================= */

          if (firstLoad) {

            map.setView(
              [lat, lng],
              17
            );

            firstLoad = false;

          } else {

            map.panTo(
              [lat, lng]
            );

          }


          /* =================================
             ENTERING GEOFENCE
          ================================= */

          if (
            wasInside === false &&
            inside === true
          ) {

            sendGeofenceNotification(
              distance
            );

          }


          /* Save current state */

          wasInside = inside;


        },
        function(error) {

          console.error(
            "Firebase error:",
            error
          );

          statusDiv.innerText =
            "Firebase connection error ❌";

          statusDiv.style.background =
            "rgba(220,53,69,0.9)";

        }
      );

  </script>

</body>
</html>
