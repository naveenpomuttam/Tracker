<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live GPS Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: Arial, sans-serif;
    }
    #map {
      height: 100vh;
      width: 100%;
    }
    #status {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <div id="status">Connecting to Firebase...</div>
  <div id="map"></div>

  <!-- Leaflet JS for Maps -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // നിങ്ങളുടെ ഫയർബേസ് കോൺഫിഗറേഷൻ
    const firebaseConfig = {
      databaseURL: "https://gps-tracker-4714a-default-rtdb.firebaseio.com"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Leaflet Map Initialization
    const map = L.map('map').setView([0, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let marker, circle;
    let firstLoad = true;

    // Read Data from 'GPS' path
    const gpsRef = database.ref('GPS');

    gpsRef.on('value', (snapshot) => {
      const data = snapshot.val();
      const statusDiv = document.getElementById('status');

      if (data && data.Latitude && data.longitude) {
        const lat = parseFloat(data.Latitude);
        const lng = parseFloat(data.longitude);
        const sats = data.satellites || 0;

        statusDiv.innerText = `Live GPS Connected (${sats} Satellites)`;
        statusDiv.style.background = "rgba(40, 167, 69, 0.9)";

        // Update Marker Position
        if (marker) {
          marker.setLatLng([lat, lng]);
        } else {
          marker = L.marker([lat, lng]).addTo(map);
        }

        // Center Map on Location First Time
        if (firstLoad) {
          map.setView([lat, lng], 16);
          firstLoad = false;
        }
      } else {
        statusDiv.innerText = "Waiting for valid GPS data...";
        statusDiv.style.background = "rgba(220, 53, 69, 0.9)";
      }
    }, (error) => {
      document.getElementById('status').innerText = "Database Connection Failed!";
      console.error(error);
    });
  </script>
</body>
</html>
