<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Live GPS Tracker</title>

  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      height: 100vh;
      width: 100%;
    }

    #status {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;

      background: rgba(0, 0, 0, 0.8);
      color: white;

      padding: 8px 16px;
      border-radius: 20px;

      font-size: 14px;

      box-shadow: 0 2px 6px rgba(0,0,0,0.3);

      text-align: center;

      transition: background 0.3s ease;

      max-width: 90%;
    }


    /* =========================
       WELCOME POPUP
       ========================= */

    #welcomeModal {
      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background: rgba(0, 0, 0, 0.7);

      z-index: 9999;

      display: flex;

      justify-content: center;
      align-items: center;

      padding: 20px;

      box-sizing: border-box;
    }


    .modal-content {
      background: #ffffff;

      padding: 25px;

      border-radius: 16px;

      max-width: 400px;
      width: 100%;

      text-align: center;

      box-shadow: 0 10px 25px rgba(0,0,0,0.3);

      animation: fadeIn 0.4s ease-out;
    }


    .bus-icon {
      font-size: 50px;
      margin-bottom: 10px;
    }


    .modal-title {
      font-size: 20px;

      font-weight: bold;

      color: #1a73e8;

      margin-bottom: 10px;
    }


    .modal-text {
      font-size: 14px;

      color: #444;

      line-height: 1.6;

      margin-bottom: 20px;
    }


    .start-btn {
      background: #28a745;

      color: white;

      border: none;

      padding: 12px 24px;

      font-size: 16px;

      font-weight: bold;

      border-radius: 25px;

      cursor: pointer;

      box-shadow: 0 4px 10px rgba(40, 167, 69, 0.4);
    }


    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>


<body>


  <!-- =========================
       WELCOME MESSAGE
       ========================= -->

  <div id="welcomeModal">

    <div class="modal-content">

      <div class="bus-icon">🚌</div>

      <div class="modal-title">
        സ്വാഗതം!
      </div>

      <div class="modal-text">

        ഇത് <b>നവീൻ ചന്ദ്ര</b>
        വികസിപ്പിച്ചെടുത്ത ജിപിഎസ് ട്രാക്കർ ആപ്പാണ്.

        <br><br>

        ലൈവ് ട്രാക്കിംഗ് ആരംഭിക്കാൻ
        താഴെയുള്ള ബട്ടൺ ക്ലിക്ക് ചെയ്യുക.

      </div>


      <button class="start-btn"
              onclick="startTracking()">

        ട്രാക്കിംഗ് ആരംഭിക്കുക

      </button>

    </div>

  </div>


  <!-- =========================
       STATUS
       ========================= -->

  <div id="status">
    Connecting to Firebase...
  </div>


  <!-- =========================
       MAP
       ========================= -->

  <div id="map"></div>


  <!-- Leaflet -->

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


  <!-- Firebase -->

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>


  <script>


    /* ==========================================
       START TRACKING
       ========================================== */

    function startTracking() {

      document.getElementById('welcomeModal').style.display = 'none';


      /*
       Request notification permission
      */

      if ("Notification" in window) {

        if (Notification.permission === "default") {

          Notification.requestPermission()
            .then(function(permission) {

              if (permission === "granted") {

                console.log("Notification permission granted.");

              }

            });

        }

      }

    }



    /* ==========================================
       FIREBASE CONFIG
       ========================================== */

    const firebaseConfig = {

      databaseURL:
        "https://gps-tracker-4714a-default-rtdb.firebaseio.com"

    };


    firebase.initializeApp(firebaseConfig);


    const database = firebase.database();



    /* ==========================================
       MAP INITIALIZATION
       ========================================== */

    const map =
      L.map('map').setView(
        [8.7335, 76.7722],
        16
      );


    L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 19,

        attribution:
          '© OpenStreetMap'
      }
    ).addTo(map);



    /* ==========================================
       GEOFENCE SETTINGS
       ========================================== */

    const GEOFENCE_LAT = 8.7156794;

    const GEOFENCE_LNG = 76.7772765;

    const GEOFENCE_RADIUS = 500;



    /* ==========================================
       GEOFENCE CIRCLE
       ========================================== */

    const geofenceCircle =

      L.circle(

        [GEOFENCE_LAT, GEOFENCE_LNG],

        {

          radius: GEOFENCE_RADIUS

        }

      ).addTo(map);


    geofenceCircle.bindPopup(

      "<b>📍 Geofence Area</b><br>" +
      "500 മീറ്റർ പരിധി"

    );



    /* ==========================================
       GEOFENCE CENTER MARKER
       ========================================== */

    const geofenceMarker =

      L.marker(

        [GEOFENCE_LAT, GEOFENCE_LNG]

      ).addTo(map);


    geofenceMarker.bindPopup(

      "<b>📍 Geofence Center</b><br>" +
      "500 മീറ്റർ Radius"

    );



    /* ==========================================
       GPS VARIABLES
       ========================================== */

    let gpsMarker = null;

    let firstLoad = true;

    let isInsideGeofence = false;

    let geofenceInitialized = false;


    const statusDiv =
      document.getElementById('status');



    /* ==========================================
       SEND PHONE NOTIFICATION
       ========================================== */

    function sendGeofenceNotification(distance) {

      if (!("Notification" in window)) {

        return;

      }


      if (Notification.permission !== "granted") {

        return;

      }


      new Notification(

        "🚌 GPS Tracker Alert",

        {

          body:
            "ട്രാക്കർ 500 മീറ്റർ Geofence പരിധിയിൽ എത്തിയിരിക്കുന്നു.\n" +
            "Distance: " +
            Math.round(distance) +
            " മീറ്റർ",

          icon: "icon-192.png"

        }

      );

    }



    /* ==========================================
       FIREBASE GPS LISTENER
       ========================================== */

    database.ref('GPS').on(

      'value',

      (snapshot) => {


        const data = snapshot.val();


        if (!data) {

          statusDiv.innerText =
            "GPS data not available";

          statusDiv.style.background =
            "rgba(220, 53, 69, 0.9)";

          return;

        }



        /* ======================================
           READ LATITUDE
           ====================================== */

        const rawLat =

          data.Latitude ||
          data.latitude ||
          data.lat;



        /* ======================================
           READ LONGITUDE
           ====================================== */

        const rawLng =

          data.longitude ||
          data.Longitude ||
          data.lng;



        const lat = parseFloat(rawLat);

        const lng = parseFloat(rawLng);



        /* ======================================
           VALID GPS DATA
           ====================================== */

        if (

          !isNaN(lat) &&
          !isNaN(lng) &&
          lat !== 0 &&
          lng !== 0

        ) {


          /* ====================================
             CALCULATE DISTANCE
             ==================================== */

          const trackerPosition =
            L.latLng(lat, lng);


          const geofenceCenter =
            L.latLng(
              GEOFENCE_LAT,
              GEOFENCE_LNG
            );


          const distance =
            trackerPosition.distanceTo(
              geofenceCenter
            );



          /* ====================================
             CHECK GEOFENCE
             ==================================== */

          const currentlyInside =
            distance <= GEOFENCE_RADIUS;



          /* ====================================
             FIRST GPS LOCATION
             ==================================== */

          if (!geofenceInitialized) {

            isInsideGeofence =
              currentlyInside;

            geofenceInitialized = true;

          }


          /* ====================================
             ENTER GEOFENCE
             ==================================== */

          if (

            currentlyInside &&
            !isInsideGeofence

          ) {

            isInsideGeofence = true;


            sendGeofenceNotification(
              distance
            );

          }



          /* ====================================
             EXIT GEOFENCE
             ==================================== */

          if (

            !currentlyInside &&
            isInsideGeofence

          ) {

            isInsideGeofence = false;

          }



          /* ====================================
             STATUS DISPLAY
             ==================================== */

          if (currentlyInside) {

            statusDiv.innerText =

              "📍 Geofence ഉള്ളിൽ 🟢 " +
              Math.round(distance) +
              " m";

            statusDiv.style.background =
              "rgba(40, 167, 69, 0.9)";

          }

          else {

            statusDiv.innerText =

              "GPS Live 🟢 | " +
              Math.round(distance) +
              " m from Geofence";

            statusDiv.style.background =
              "rgba(0, 0, 0, 0.8)";

          }



          /* ====================================
             GPS MARKER
             ==================================== */

          if (gpsMarker) {

            gpsMarker.setLatLng(
              [lat, lng]
            );

          }

          else {

            gpsMarker =

              L.marker(
                [lat, lng]
              )
              .addTo(map)
              .bindPopup(
                "<b>ESP32 ജിപിഎസ് ട്രാക്കർ 🚌</b>"
              );

          }



          /* ====================================
             FIRST MAP POSITION
             ==================================== */

          if (firstLoad) {

            map.setView(
              [lat, lng],
              17
            );

            firstLoad = false;

          }

          else {

            map.panTo(
              [lat, lng]
            );

          }

        }

      }

    );


  </script>

</body>
</html>
