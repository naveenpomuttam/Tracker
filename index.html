<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live GPS Tracker - Naveen Chandra</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: Arial, sans-serif;
    }
    #map {
      height: 100vh;
      width: 100%;
    }
    #status {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      text-align: center;
      transition: background 0.3s ease;
    }

    #welcomeModal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .modal-content {
      background: #ffffff;
      padding: 25px;
      border-radius: 16px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      animation: fadeIn 0.4s ease-out;
    }
    .bus-icon {
      font-size: 50px;
      margin-bottom: 10px;
    }
    .modal-title {
      font-size: 20px;
      font-weight: bold;
      color: #1a73e8;
      margin-bottom: 10px;
    }
    .modal-text {
      font-size: 14px;
      color: #444;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .start-btn {
      background: #28a745;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(40, 167, 69, 0.4);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- വെൽക്കം സന്ദേശം -->
  <div id="welcomeModal">
    <div class="modal-content">
      <div class="bus-icon">🚌</div>
      <div class="modal-title">സ്വാഗതം!</div>
      <div class="modal-text">
        ഇത് <b>നവീൻ ചന്ദ്ര</b> വികസിപ്പിച്ചെടുത്ത ജിപിഎസ് ട്രാക്കർ ആപ്പാണ്.<br><br>
        വാഹനം നിങ്ങളുടെ ലൊക്കേഷന്റെ <b>500 മീറ്റർ</b> ചുറ്റളവിൽ എത്തുമ്പോൾ നോട്ടിഫിക്കേഷൻ ലഭിക്കാൻ താഴെയുള്ള ബട്ടൺ ക്ലിക്ക് ചെയ്യുക.
      </div>
      <button class="start-btn" onclick="startTracking()">ട്രാക്കിംഗ് ആരംഭിക്കുക 🔔</button>
    </div>
  </div>

  <div id="status">Connecting to Firebase...</div>
  <div id="map"></div>

  <!-- Leaflet JS for Maps -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // ==========================================
    // 1. നിങ്ങളുടെ സ്റ്റോപ്പിന്റെ ലൊക്കേഷൻ (Lat, Lng)
    // ==========================================
    const TARGET_LAT = 8.6823;   // നിങ്ങളുടെ Latitude നൽകുക
    const TARGET_LNG = 76.8214;  // നിങ്ങളുടെ Longitude നൽകുക
    const TRIGGER_RADIUS_METERS = 500; 

    let notificationSent = false;

    function startTracking() {
      if ("Notification" in window && Notification.permission !== "granted") {
        Notification.requestPermission();
      }
      document.getElementById('welcomeModal').style.display = 'none';
    }

    // ==========================================
    // 2. FIREBASE CONFIG
    // ==========================================
    const firebaseConfig = {
      databaseURL: "https://gps-tracker-4714a-default-rtdb.firebaseio.com"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Leaflet Map
    const map = L.map('map').setView([TARGET_LAT, TARGET_LNG], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // നിങ്ങളുടെ സ്റ്റോപ്പ് വളരെ ചെറിയൊരു നീല ഡോട്ടായി കാണിക്കാൻ (CircleMarker)
    L.circleMarker([TARGET_LAT, TARGET_LNG], {
      radius: 6,
      fillColor: "#007bff",
      color: "#ffffff",
      weight: 2,
      opacity: 1,
      fillOpacity: 0.9
    }).addTo(map).bindPopup("നിങ്ങളുടെ സ്റ്റോപ്പ്");

    let busMarker;
    let firstLoad = true;
    let lastDataTime = Date.now();

    const statusDiv = document.getElementById('status');

    // Haversine Formula
    function getDistanceFromLatLonInMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2); 
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
      return R * c;
    }

    // നോട്ടിഫിക്കേഷൻ മാത്രം അയക്കാൻ
    function triggerNotification(distance) {
      if (!notificationSent) {
        if ("Notification" in window && Notification.permission === "granted") {
          new Notification("വാഹനം അടുത്തെത്തി! 🚌", {
            body: `വാഹനം നിങ്ങളുടെ ലൊക്കേഷന്റെ ${Math.round(distance)} മീറ്റർ ചുറ്റളവിൽ എത്തിയിരിക്കുന്നു!`,
            icon: "https://cdn-icons-png.flaticon.com/512/3448/3448339.png"
          });
        }
        notificationSent = true;
      }
    }

    // Firebase Data Reading
    const gpsRef = database.ref('GPS');

    gpsRef.on('value', (snapshot) => {
      const data = snapshot.val();

      if (data) {
        lastDataTime = Date.now();

        const rawLat = data.Latitude || data.latitude || data.lat;
        const rawLng = data.longitude || data.Longitude || data.lng;
        const deviceStatus = data.status || data.Status || "ONLINE";

        const lat = parseFloat(rawLat);
        const lng = parseFloat(rawLng);

        if (deviceStatus === "ONLINE" && !isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0) {
          const sats = data.satellites || data.Satellites || 0;
          
          const distanceMeters = getDistanceFromLatLonInMeters(lat, lng, TARGET_LAT, TARGET_LNG);

          statusDiv.innerText = `Live GPS Connected 🟢 (${sats} Satellites) - ${Math.round(distanceMeters)}m അകലെ`;
          statusDiv.style.background = "rgba(40, 167, 69, 0.9)";
          statusDiv.style.color = "#fff";

          if (distanceMeters <= TRIGGER_RADIUS_METERS) {
            triggerNotification(distanceMeters);
          } else {
            notificationSent = false;
          }

          // ബസ്സ് വരുന്ന ഭാഗത്ത് മാപ്പ് ഫോളോ ചെയ്യാനും ഓട്ടോമാറ്റിക് സൂം ആകാനും
          if (busMarker) {
            busMarker.setLatLng([lat, lng]);
          } else {
            busMarker = L.marker([lat, lng]).addTo(map).bindPopup("ജിപിഎസ് ട്രാക്കർ");
          }

          // ആദ്യമായി ഡാറ്റ വരുമ്പോഴോ ലൊക്കേഷൻ മാറുമ്പോഴോ ഓട്ടോമാറ്റിക്കായി സൂം ചെയ്യുന്നു
          if (firstLoad) {
            map.setView([lat, lng], 17); // കൃത്യമായ സൂം ലെവൽ (17)
            firstLoad = false;
          } else {
            map.panTo([lat, lng]); // വാഹനം നീങ്ങുന്നതിനനുസരിച്ച് മാപ്പ് കൂടെ നീങ്ങും
          }

        } else if (deviceStatus === "NO_GPS_FIX") {
          statusDiv.innerText = "Waiting for GPS Satellite Fix... 🟡 (0 Satellites)";
          statusDiv.style.background = "rgba(255, 193, 7, 0.9)";
          statusDiv.style.color = "#000";
        }
      }
    });

    setInterval(() => {
      if (Date.now() - lastDataTime > 8000) {
        statusDiv.innerText = "Bus Offline 🔴 (0 Satellites)";
        statusDiv.style.background = "rgba(220, 53, 69, 0.9)";
        statusDiv.style.color = "#fff";
      }
    }, 2000);
  </script>
</body>
</html>
